[package]
name = "mac-anal"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
dispatch2 = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sysinfo = { version = "0.40", default-features = false, features = ["component", "disk", "gpu", "network", "system"] }
tray-icon = { version = "0.26", default-features = false }

[dev-dependencies]
resvg = "0.45"
