name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main keeps its own result; only PR runs are superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # The toolchain the app declares (rust-version), so a new stable clippy
      # does not fail the build with lints nobody saw locally.
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
